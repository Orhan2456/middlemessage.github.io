<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Middle Message 26</title>
    
    <!-- Firebase V8 Kütüphaneleri -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* Threads / Instagram Dark Mode Renk Paleti */
        :root {
            --bg-base: #101010;
            --text-main: #F3F5F7;
            --text-muted: #777777;
            --border: #2A2A2A;
            --accent: #E0E0E0;
            --like-color: #FF3040;
            --danger: #FF453A;
            --mention: #0A84FF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        #app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 600px;
            height: 100%;
            background-color: var(--bg-base);
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            scroll-behavior: smooth;
            position: relative;
        }

        header {
            position: sticky;
            top: 0;
            padding: 16px 20px;
            background: rgba(16, 16, 16, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        .header-left-actions {
            position: absolute;
            left: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .header-icon-btn {
            background: none; border: none; color: var(--text-muted); cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: color 0.2s, transform 0.1s;
        }
        .header-icon-btn:hover { color: var(--text-main); }
        .header-icon-btn.danger-btn:hover { color: var(--danger); }
        .header-icon-btn.admin-btn-header:hover { color: #f5a623; }
        .header-icon-btn:active { transform: scale(0.9); }

        .brand { font-weight: 700; font-size: 1.1rem; letter-spacing: 0.5px; cursor: pointer; user-select: none; }

        .status {
            position: absolute; right: 20px; width: 8px; height: 8px;
            border-radius: 50%; background: #3fb950;
        }
        .status.offline { background: #FF453A; }

        /* ARAMA ÇUBUĞU */
        #search-container {
            padding: 12px 20px; background: var(--bg-base); border-bottom: 1px solid var(--border);
            position: relative; z-index: 40;
        }
        
        .search-input-wrapper {
            display: flex; background-color: #1A1A1A; border-radius: 20px; padding: 8px 16px;
            border: 1px solid #333; align-items: center; gap: 10px;
        }
        #user-search-input { flex: 1; background: none; border: none; color: var(--text-main); font-size: 0.95rem; outline: none; }

        #suggestions-box {
            position: absolute; top: 100%; left: 20px; right: 20px; background: #161616;
            border: 1px solid #333; border-radius: 12px; max-height: 250px; overflow-y: auto;
            display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.7); margin-top: 5px;
        }

        .suggestion-item {
            padding: 12px 16px; display: flex; align-items: center; gap: 12px;
            cursor: pointer; border-bottom: 1px solid #222; transition: background 0.2s;
        }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background: #222; }
        .sugg-avatar {
            width: 32px; height: 32px; border-radius: 50%; background: #333;
            display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.9rem; object-fit: cover;
        }

        /* YAZMA ALANI */
        #hero-section {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 35vh; padding: 20px 10px; border-bottom: 1px solid var(--border);
            background: radial-gradient(circle at center, #181818 0%, #101010 100%);
        }

        .input-wrapper {
            display: flex; background-color: #1A1A1A; border-radius: 30px; padding: 6px 6px 6px 20px;
            border: 1px solid #333; align-items: center; width: 95%; max-width: 500px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: border-color 0.3s; gap: 10px;
        }
        .input-wrapper:focus-within { border-color: #555; }
        
        #msg-input { 
            flex: 1; min-width: 0; background: none; border: none; color: var(--text-main); font-size: 1rem; outline: none; 
        }
        
        #send-btn {
            flex-shrink: 0; background-color: var(--text-main); color: var(--bg-base); border: none; 
            padding: 10px 20px; border-radius: 20px; font-weight: 700; font-size: 0.95rem; 
            cursor: pointer; transition: opacity 0.2s, transform 0.1s;
        }
        #send-btn:active { transform: scale(0.95); }
        #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* YAZIYOR GÖSTERGESİ */
        #typing-indicator {
            padding: 10px 20px; color: var(--text-muted); font-size: 0.85rem; font-style: italic;
            display: none; animation: fadeIn 0.3s ease;
        }

        /* AKIŞ VE GÖNDERİLER */
        #feed-window { display: flex; flex-direction: column; padding-bottom: 50px; }
        .thread-post { display: flex; gap: 12px; padding: 20px; border-bottom: 1px solid var(--border); animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .clickable-profile { cursor: pointer; transition: opacity 0.2s; }
        .clickable-profile:hover { opacity: 0.7; }
        .post-author.clickable-profile:hover { text-decoration: underline; }

        .post-avatar { display: flex; flex-direction: column; align-items: center; }
        .avatar-circle {
            width: 42px; height: 42px; border-radius: 50%; background-color: #1e1e1e;
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; color: #ccc; font-size: 1.1rem; border: 1px solid #333;
            text-transform: uppercase; object-fit: cover;
        }

        .post-content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        
        .post-author-wrapper { display: flex; align-items: center; gap: 4px; }
        .post-author { font-weight: 600; font-size: 0.95rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .verified-badge { width: 14px; height: 14px; color: var(--mention); flex-shrink: 0; }

        .post-time { font-size: 0.85rem; color: var(--text-muted); flex-shrink: 0; }
        
        .post-text { font-size: 1rem; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; color: #E5E5E5; margin-bottom: 12px; }
        
        .post-link { color: var(--mention); text-decoration: none; }
        .post-link:hover { text-decoration: underline; }
        .mention { color: var(--mention); font-weight: 600; background: rgba(10, 132, 255, 0.15); padding: 2px 6px; border-radius: 6px; }

        .post-actions { display: flex; gap: 16px; }
        .action-btn { background: none; border: none; color: var(--text-main); cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 0.9rem; transition: transform 0.1s; }
        .action-btn:active { transform: scale(0.9); }
        .btn-like svg { fill: none; stroke: var(--text-main); stroke-width: 2; }
        .btn-like.liked { color: var(--like-color); font-weight: 500; }
        .btn-like.liked svg { fill: var(--like-color); stroke: var(--like-color); }

        /* MODALLAR */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }

        .modal-box {
            background-color: #161616; border: 1px solid var(--border); padding: 35px 25px;
            border-radius: 24px; text-align: center; width: 90%; max-width: 340px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); animation: fadeIn 0.3s ease; position: relative;
        }

        .modal-box h2 { margin-bottom: 10px; font-size: 1.4rem; }
        .modal-box p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px; line-height: 1.4; }
        
        .auth-input { 
            width: 100%; padding: 14px 20px; border-radius: 12px; border: 1px solid #333; 
            background: #000; color: #fff; font-size: 1.05rem; outline: none; text-align: center; margin-bottom: 10px; 
        }
        
        .main-btn { 
            width: 100%; padding: 14px; border-radius: 12px; background: var(--text-main); color: var(--bg-base); 
            font-size: 1.05rem; font-weight: 700; border: none; cursor: pointer; margin-top: 5px;
        }

        /* PROFİL MODALI STİLLERİ */
        .modal-close-btn {
            position: absolute; top: 15px; right: 15px; background: none; border: none;
            color: #888; cursor: pointer; font-size: 1.5rem; line-height: 1; padding: 5px;
        }
        .modal-close-btn:hover { color: #fff; }
        
        .profile-avatar-container { position: relative; width: 85px; height: 85px; margin: 0 auto 15px; }
        .profile-avatar-large {
            width: 85px; height: 85px; border-radius: 50%; background: #222;
            display: flex; justify-content: center; align-items: center; font-size: 2.5rem;
            font-weight: bold; border: 2px solid #444; color: #E0E0E0; text-transform: uppercase; object-fit: cover;
        }
        
        #avatar-upload-label {
            position: absolute; bottom: 0; right: 0; background: var(--text-main);
            color: var(--bg-base); width: 28px; height: 28px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5); border: 2px solid #161616; transition: transform 0.2s;
        }
        #avatar-upload-label:hover { transform: scale(1.1); }

        .profile-username { display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 1.5rem; font-weight: bold; margin-bottom: 5px; }
        
        .profile-bio { font-size: 0.95rem; color: #ccc; margin-bottom: 10px; font-style: italic; }
        #edit-bio-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.85rem; margin-bottom: 15px; text-decoration: underline; display: none; margin-left: auto; margin-right: auto; }
        #edit-bio-btn:hover { color: var(--text-main); }

        .follower-count-box { color: var(--text-muted); font-size: 1rem; margin-bottom: 25px; }
        .follower-count-box span { color: var(--text-main); font-weight: bold; }
        
        #follow-btn {
            padding: 12px 30px; border-radius: 20px; background: var(--text-main); color: var(--bg-base);
            font-size: 1.05rem; font-weight: bold; border: none; cursor: pointer; width: 100%; transition: 0.2s;
        }
        #follow-btn.following { background: transparent; color: var(--text-main); border: 1px solid #555; }

        /* YÖNETİM (ADMIN) PANELI STİLLERİ */
        #admin-user-list {
            max-height: 400px; overflow-y: auto; text-align: left; margin-top: 20px;
            border-top: 1px solid #333; padding-top: 10px;
        }
        .admin-user-row {
            display: flex; flex-direction: column; gap: 8px;
            padding: 12px 0; border-bottom: 1px solid #222;
        }
        .admin-user-info { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 1.05rem; }
        .admin-user-role { font-size: 0.75rem; background: #333; padding: 2px 6px; border-radius: 4px; color: #bbb; }
        .admin-user-role.admin-badge { background: #f5a623; color: #000; }
        .admin-user-role.banned-badge { background: var(--danger); color: #fff; }
        
        .admin-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .admin-btn-small {
            background: #333; color: #fff; border: none; padding: 6px 10px;
            border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-weight: 600;
        }
        .admin-btn-small:hover { opacity: 0.8; }
        .admin-btn-small.danger { background: var(--danger); }
        .admin-btn-small.success { background: #3fb950; }
        .admin-btn-small.primary { background: var(--mention); }

        @media (max-width: 600px) {
            #app-container { border: none; }
            #hero-section { min-height: 30vh; }
        }
    </style>
</head>
<body>

<!-- SVG IKONLARI -->
<svg style="display:none;">
    <!-- Mavi Tik İkonu -->
    <symbol id="icon-verified" viewBox="0 0 24 24">
        <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"></path>
    </symbol>
</svg>

<div id="welcome-modal" class="modal-overlay">
    <div class="modal-box">
        <h2>Middle Message 26</h2>
        <p>Ağa katılmak ve paylaşım yapmak için kullanıcı adı belirleyin.</p>
        <input type="text" id="username-input" class="auth-input" placeholder="Kullanıcı Adınız" autocomplete="off" maxlength="15">
        <input type="password" id="password-input" class="auth-input" placeholder="Şifreniz (Korumalı Hesap)" style="display:none;" autocomplete="off">
        <button id="start-btn" class="main-btn">Sohbete Katıl</button>
    </div>
</div>

<div id="profile-modal" class="modal-overlay">
    <div class="modal-box">
        <button id="profile-close" class="modal-close-btn">&times;</button>
        <div class="profile-avatar-container">
            <img id="profile-img" class="profile-avatar-large" style="display: none;">
            <div id="profile-initial" class="profile-avatar-large">A</div>
            
            <label for="avatar-upload" id="avatar-upload-label" style="display: none;" title="Fotoğraf Yükle">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle>
                </svg>
            </label>
            <input type="file" id="avatar-upload" accept="image/*" style="display: none;">
        </div>
        
        <div class="profile-username">
            <span id="profile-name">Anonim</span>
            <svg class="verified-badge" id="profile-verified-icon" style="display:none;"><use href="#icon-verified"></use></svg>
        </div>
        
        <div class="profile-bio" id="profile-bio"></div>
        <button id="edit-bio-btn">Düzenle</button>

        <div class="follower-count-box"><span id="profile-followers">0</span> Takipçi</div>
        <button id="follow-btn">Takip Et</button>
    </div>
</div>

<!-- YÖNETİCİ (ADMIN) MODALI -->
<div id="admin-modal" class="modal-overlay">
    <div class="modal-box" style="max-width: 450px; width: 95%;">
        <button id="admin-close" class="modal-close-btn">&times;</button>
        <h2>Yönetim Paneli</h2>
        <p style="margin-bottom:0;">Sistemdeki tüm kullanıcıları buradan yönetebilirsiniz.</p>
        <div id="admin-user-list">
            <!-- Kullanıcılar buraya yüklenecek -->
        </div>
    </div>
</div>

<div id="app-container">
    <header>
        <div class="header-left-actions">
            <button class="header-icon-btn danger-btn" id="logout-btn" title="Çıkış Yap">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
            <button class="header-icon-btn" id="my-profile-btn" title="Kendi Profilim">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>
                </svg>
            </button>
            <!-- ADMİN BUTONU (Sadece yetkililer görür) -->
            <button class="header-icon-btn admin-btn-header" id="admin-panel-btn" title="Yönetim Paneli" style="display:none;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
            </button>
        </div>
        <div class="brand" id="brand-logo" title="Gizli Admin Girişi için Çift Tıkla">Middle Message 26</div>
        <div class="status" id="connection-status"></div>
    </header>
    
    <div id="search-container">
        <div class="search-input-wrapper">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="user-search-input" placeholder="Kişi ara..." autocomplete="off">
        </div>
        <div id="suggestions-box"></div>
    </div>
    
    <div id="hero-section">
        <div class="input-wrapper">
            <input type="text" id="msg-input" placeholder="Bir şey paylaş..." autocomplete="off">
            <button id="send-btn">Paylaş</button>
        </div>
    </div>
    
    <div id="typing-indicator"></div>
    <div id="feed-window"></div>
</div>

<script>
    // ========================================================
    // 1. FIREBASE BAĞLANTISI VE DÜĞÜMLER
    // ========================================================
    const firebaseConfig = {
      apiKey: "AIzaSyD-E9XQdyJBg8fW2_UcT_wbRCGwhckzmKA",
      authDomain: "middlemessage26.firebaseapp.com",
      databaseURL: "https://middlemessage26-default-rtdb.firebaseio.com",
      projectId: "middlemessage26",
      storageBucket: "middlemessage26.firebasestorage.app",
      messagingSenderId: "395440473558",
      appId: "1:395440473558:web:ccf986566cf3d2b600d077",
      measurementId: "G-WQ67GTWB1Q"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const messagesRef = db.ref('middle_message_26_room');
    const usersRef = db.ref('middle_message_26_users');
    const followersRef = db.ref('middle_message_26_followers');
    const typingRef = db.ref('middle_message_26_typing');

    // ========================================================
    // BİLDİRİM VE SES SİSTEMİ
    // ========================================================
    const APP_LOAD_TIME = Date.now();
    const notifiedMessages = new Set();
    let unreadCount = 0;
    const notifSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

    function askNotificationPermission() {
        if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
            Notification.requestPermission();
        }
    }
    function sendDesktopNotification(title, body) {
        if ("Notification" in window && Notification.permission === "granted") {
            new Notification(title, { body: body, icon: "https://cdn-icons-png.flaticon.com/512/3114/3114883.png" });
        }
    }
    window.addEventListener('focus', () => { unreadCount = 0; document.title = 'Middle Message 26'; });

    function escapeHTML(str) {
        if (!str) return "";
        return str.replace(/[&<>'"]/g, tag => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[tag]));
    }

    // ========================================================
    // KULLANICI VERİLERİ & YETKİ KONTROLÜ
    // ========================================================
    let allUsersData = {};
    let myUsername = localStorage.getItem('mm26_username');

    usersRef.on('value', snap => { 
        if (snap.val()) {
            allUsersData = snap.val(); 
            
            // BAN KONTROLÜ: Kullanıcı anlık sitedeyken banlanırsa sistemden atılır
            if (myUsername && allUsersData[myUsername] && allUsersData[myUsername].banned) {
                alert("Hesabınız bir yönetici tarafından kalıcı olarak engellenmiştir.");
                localStorage.removeItem('mm26_username');
                window.location.reload();
            }

            // ADMİN BUTONU GÖSTERİMİ
            if (myUsername && allUsersData[myUsername] && allUsersData[myUsername].role === 'admin') {
                document.getElementById('admin-panel-btn').style.display = 'flex';
            } else {
                document.getElementById('admin-panel-btn').style.display = 'none';
            }
        } 
    });

    // ========================================================
    // GİRİŞ & ŞİFRE SİSTEMİ
    // ========================================================
    const welcomeModal = document.getElementById('welcome-modal');
    const nameInput = document.getElementById('username-input');
    const passInput = document.getElementById('password-input');
    const startBtn = document.getElementById('start-btn');
    const logoutBtn = document.getElementById('logout-btn');
    
    // GİZLİ ADMİN YAPMA (Çift Tıklama)
    document.getElementById('brand-logo').addEventListener('dblclick', () => {
        if (!myUsername) return;
        const secret = prompt("Kurucu şifresini girin:");
        if (secret && btoa(secret) === "T3JoYW5BZG1pbg==") { // OrhanAdmin
            usersRef.child(myUsername).update({ role: 'admin' });
            alert("Tebrikler! Kurucu Yönetici yetkileriniz aktif edildi.");
        }
    });

    if (!myUsername) {
        welcomeModal.style.display = 'flex';
        nameInput.focus();
    } else {
        askNotificationPermission(); 
        usersRef.child(myUsername).update({ lastActive: Date.now() });
    }

    function saveUsername() {
        let val = nameInput.value.trim().replace(/[.#$\[\]]/g, '');
        if (val.length < 3) return alert('Lütfen en az 3 harfli geçerli bir isim girin.');

        // Kullanıcı önceden kayıtlı mı kontrol et
        usersRef.child(val).once('value').then(snap => {
            const data = snap.val();
            
            // HESAP VARSA VE BANLIYSA
            if (data && data.banned) {
                return alert("Bu hesabın sisteme erişimi engellenmiştir!");
            }
            
            // HESAP VARSA VE ŞİFRELİYSE (Korumalı Hesap / Admin)
            if (data && data.password) {
                if (passInput.style.display === 'none') {
                    // İlk defa tıklanıyorsa şifre kutusunu aç
                    alert(`Bu hesap korumalıdır (@${val}). Lütfen şifrenizi girin.`);
                    passInput.style.display = 'block';
                    passInput.focus();
                    return;
                } else {
                    // Şifre kutusu açıksa şifreyi kontrol et
                    if (passInput.value !== data.password) {
                        return alert("Hatalı şifre girdiniz!");
                    }
                }
            }

            // GİRİŞ BAŞARILI
            myUsername = val;
            localStorage.setItem('mm26_username', myUsername);
            
            // Sadece yeni kayıt ise oluşturma tarihini yaz, eski hesapsa sadece online yap
            if (!data) usersRef.child(myUsername).update({ username: myUsername, createdAt: Date.now() });
            else usersRef.child(myUsername).update({ lastActive: Date.now() });
            
            welcomeModal.style.display = 'none'; 
            askNotificationPermission(); 
            notifSound.volume = 0;
            notifSound.play().then(() => { notifSound.pause(); notifSound.volume = 1; }).catch(e => console.log(e));
        });
    }

    startBtn.addEventListener('click', saveUsername);
    passInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') saveUsername(); });
    nameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') saveUsername(); });

    logoutBtn.addEventListener('click', () => {
        if (confirm('Çıkış yapmak istediğinize emin misiniz?')) {
            localStorage.removeItem('mm26_username'); window.location.reload(); 
        }
    });

    // ========================================================
    // YÖNETİCİ (ADMIN) PANELİ İŞLEMLERİ
    // ========================================================
    const adminModal = document.getElementById('admin-modal');
    const adminBtn = document.getElementById('admin-panel-btn');
    const adminCloseBtn = document.getElementById('admin-close');
    const adminUserList = document.getElementById('admin-user-list');

    adminBtn.addEventListener('click', () => {
        renderAdminPanel();
        adminModal.style.display = 'flex';
    });

    adminCloseBtn.onclick = () => { adminModal.style.display = 'none'; };

    function renderAdminPanel() {
        adminUserList.innerHTML = '';
        const userKeys = Object.keys(allUsersData);
        
        userKeys.forEach(uKey => {
            const uData = allUsersData[uKey];
            const div = document.createElement('div');
            div.className = 'admin-user-row';
            
            // Badge (Etiket) Belirleme
            let badgeHTML = '';
            if (uData.banned) badgeHTML = `<span class="admin-user-role banned-badge">BANLI</span>`;
            else if (uData.role === 'admin') badgeHTML = `<span class="admin-user-role admin-badge">ADMİN</span>`;
            else if (uData.verified) badgeHTML = `<span class="admin-user-role" style="background:var(--mention); color:#fff;">MAVİ TİK</span>`;
            else badgeHTML = `<span class="admin-user-role">KULLANICI</span>`;

            // Aksiyon Butonları
            let actionsHTML = '';
            
            // 1. Ban Butonu
            if (uData.banned) actionsHTML += `<button class="admin-btn-small success" onclick="adminAction('${uKey}', 'unban')">Ban Kaldır</button>`;
            else actionsHTML += `<button class="admin-btn-small danger" onclick="adminAction('${uKey}', 'ban')">Banla</button>`;
            
            // 2. Mavi Tik Butonu
            if (uData.verified) actionsHTML += `<button class="admin-btn-small" onclick="adminAction('${uKey}', 'unverify')">Tiki Al</button>`;
            else actionsHTML += `<button class="admin-btn-small primary" onclick="adminAction('${uKey}', 'verify')">Mavi Tik</button>`;

            // 3. Admin Yap Butonu
            if (uData.role === 'admin') actionsHTML += `<button class="admin-btn-small" onclick="adminAction('${uKey}', 'removeAdmin')">Admin Al</button>`;
            else actionsHTML += `<button class="admin-btn-small" style="background:#f5a623; color:#000;" onclick="adminAction('${uKey}', 'makeAdmin')">Admin Yap</button>`;
            
            // 4. Sil Butonu
            actionsHTML += `<button class="admin-btn-small danger" onclick="adminAction('${uKey}', 'delete')">Kökten Sil</button>`;

            div.innerHTML = `
                <div class="admin-user-info">
                    ${escapeHTML(uKey)} ${badgeHTML}
                </div>
                <div class="admin-actions">
                    ${actionsHTML}
                </div>
            `;
            adminUserList.appendChild(div);
        });
    }

    // Global Admin Fonksiyonları
    window.adminAction = function(targetUser, action) {
        if (targetUser === myUsername && action !== 'unverify') {
            return alert("Kendi kendine bu işlemi yapamazsın.");
        }

        if (action === 'ban') {
            if(confirm(`@${targetUser} kullanıcısını banlamak istiyor musunuz?`)) usersRef.child(targetUser).update({banned: true});
        } 
        else if (action === 'unban') {
            usersRef.child(targetUser).update({banned: false});
        } 
        else if (action === 'verify' || action === 'makeAdmin') {
            const roleText = action === 'verify' ? 'Mavi Tikli' : 'Admin';
            const pass = prompt(`Bu hesabı ${roleText} yapmak istiyorsunuz.\nHesabın çalınmaması için bir şifre belirleyin:`);
            if (pass) {
                let updates = { password: pass };
                if (action === 'verify') updates.verified = true;
                if (action === 'makeAdmin') updates.role = 'admin';
                usersRef.child(targetUser).update(updates);
                alert(`İşlem başarılı. Kullanıcının şifresi: ${pass}`);
            }
        } 
        else if (action === 'unverify') {
            if(confirm('Mavi tiki almak istiyor musunuz? Şifre koruması kaldırılacaktır.')) {
                usersRef.child(targetUser).update({verified: false, password: null});
            }
        } 
        else if (action === 'removeAdmin') {
            if(confirm('Yöneticiliğini almak istiyor musunuz? Şifre koruması kaldırılacaktır.')) {
                usersRef.child(targetUser).update({role: 'user', password: null});
            }
        } 
        else if (action === 'delete') {
            if(confirm(`DİKKAT! @${targetUser} hesabını tamamen siliyorsunuz. Geri alınamaz!`)) {
                usersRef.child(targetUser).remove();
            }
        }
        
        // Ekranı güncelle
        setTimeout(renderAdminPanel, 300);
    };

    // ========================================================
    // ARAMA ÇUBUĞU
    // ========================================================
    const searchInput = document.getElementById('user-search-input');
    const suggestionsBox = document.getElementById('suggestions-box');

    searchInput.addEventListener('input', () => {
        const query = searchInput.value.trim().toLowerCase();
        suggestionsBox.innerHTML = '';
        if (query.length === 0) { suggestionsBox.style.display = 'none'; return; }

        const allUsersList = Object.keys(allUsersData);
        const filteredUsers = allUsersList.filter(u => u.toLowerCase().includes(query) && !allUsersData[u].banned).slice(0, 5);
        
        if (filteredUsers.length > 0) {
            filteredUsers.forEach(user => {
                const userData = allUsersData[user];
                let avatarHTML = '';
                if (userData && userData.profilePic) avatarHTML = `<img src="${userData.profilePic}" class="sugg-avatar">`;
                else avatarHTML = `<div class="sugg-avatar">${escapeHTML(user.charAt(0).toUpperCase())}</div>`;
                
                let verifiedHTML = userData.verified || userData.role === 'admin' ? `<svg class="verified-badge"><use href="#icon-verified"></use></svg>` : '';

                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.innerHTML = `${avatarHTML} <span style="display:flex; align-items:center; gap:5px;">${escapeHTML(user)} ${verifiedHTML}</span>`;
                div.onclick = () => { openProfile(user); searchInput.value = ''; suggestionsBox.style.display = 'none'; };
                suggestionsBox.appendChild(div);
            });
            suggestionsBox.style.display = 'block';
        } else {
            suggestionsBox.style.display = 'none';
        }
    });

    document.addEventListener('click', (e) => {
        if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) suggestionsBox.style.display = 'none';
    });

    // ========================================================
    // PROFİL GÖRÜNTÜLEME
    // ========================================================
    const profileModal = document.getElementById('profile-modal');
    const profileCloseBtn = document.getElementById('profile-close');
    const profileInitial = document.getElementById('profile-initial');
    const profileImg = document.getElementById('profile-img');
    const avatarUploadLabel = document.getElementById('avatar-upload-label');
    const avatarUploadInput = document.getElementById('avatar-upload');
    const profileName = document.getElementById('profile-name');
    const profileVerifiedIcon = document.getElementById('profile-verified-icon');
    const profileBio = document.getElementById('profile-bio');
    const editBioBtn = document.getElementById('edit-bio-btn');
    const profileFollowers = document.getElementById('profile-followers');
    const followBtn = document.getElementById('follow-btn');
    let currentProfileUser = ""; let profileListener = null;

    document.getElementById('my-profile-btn').addEventListener('click', () => { if(myUsername) openProfile(myUsername); });

    window.openProfile = function(targetUsername) {
        currentProfileUser = targetUsername;
        profileName.textContent = targetUsername;
        
        const targetUserData = allUsersData[targetUsername];
        if(!targetUserData) return;

        // Avatar
        if (targetUserData.profilePic) {
            profileImg.src = targetUserData.profilePic;
            profileImg.style.display = 'block'; profileInitial.style.display = 'none';
        } else {
            profileInitial.textContent = targetUsername.charAt(0).toUpperCase();
            profileImg.style.display = 'none'; profileInitial.style.display = 'flex';
        }
        
        // Mavi Tik Kontrol
        if (targetUserData.verified || targetUserData.role === 'admin') profileVerifiedIcon.style.display = 'block';
        else profileVerifiedIcon.style.display = 'none';
        
        // Biyografi
        const defaultBio = "Merhaba, ben Middle Message 26 kullanıcısıyım.";
        profileBio.textContent = targetUserData.bio ? targetUserData.bio : defaultBio;
        
        // Kendi Profilim Mi?
        if (targetUsername === myUsername) {
            followBtn.style.display = 'none'; 
            avatarUploadLabel.style.display = 'flex';
            editBioBtn.style.display = 'block';
        } else {
            followBtn.style.display = 'block'; 
            avatarUploadLabel.style.display = 'none';
            editBioBtn.style.display = 'none';
        }

        profileModal.style.display = 'flex';

        // Takipçi Dinleme
        if (profileListener) followersRef.child(currentProfileUser).off('value', profileListener);
        profileListener = followersRef.child(currentProfileUser).on('value', snap => {
            const followersData = snap.val();
            let count = 0; let amIFollowing = false;
            if (followersData) {
                const keys = Object.keys(followersData);
                count = keys.length;
                if (keys.includes(myUsername)) amIFollowing = true;
            }
            profileFollowers.textContent = count;
            if (amIFollowing) { followBtn.textContent = 'Takibi Bırak'; followBtn.className = 'following'; }
            else { followBtn.textContent = 'Takip Et'; followBtn.className = ''; }
        });
    }

    profileCloseBtn.onclick = () => { profileModal.style.display = 'none'; if (profileListener) followersRef.child(currentProfileUser).off('value', profileListener); };

    editBioBtn.onclick = () => {
        const newBio = prompt("Yeni biyografinizi yazın (Maks. 60 Karakter):");
        if (newBio !== null) {
            const cleanBio = newBio.trim().substring(0, 60);
            usersRef.child(myUsername).update({ bio: cleanBio });
            profileBio.textContent = cleanBio || "Merhaba, ben Middle Message 26 kullanıcısıyım.";
        }
    };

    followBtn.onclick = () => {
        if (!myUsername || currentProfileUser === myUsername) return;
        const myFollowRef = followersRef.child(currentProfileUser).child(myUsername);
        myFollowRef.once('value', snap => {
            if (snap.exists()) myFollowRef.remove(); else myFollowRef.set(true);
        });
    };

    avatarUploadInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const MAX_SIZE = 150;
                let width = img.width, height = img.height;
                if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
                else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                
                canvas.width = width; canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);
                const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
                
                usersRef.child(myUsername).update({ profilePic: compressedDataUrl });
                profileImg.src = compressedDataUrl; profileImg.style.display = 'block'; profileInitial.style.display = 'none';
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    // ========================================================
    // YAZIYOR GÖSTERGESİ SİSTEMİ
    // ========================================================
    const msgInput = document.getElementById('msg-input');
    const typingIndicatorDiv = document.getElementById('typing-indicator');
    let typingTimeout;

    msgInput.addEventListener('input', () => {
        if(!myUsername) return;
        typingRef.child(myUsername).set(true);
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => { typingRef.child(myUsername).remove(); }, 2000);
    });

    typingRef.on('value', snap => {
        const typists = snap.val() || {};
        const names = Object.keys(typists).filter(name => name !== myUsername);
        if (names.length > 0) {
            typingIndicatorDiv.textContent = names.join(', ') + ' yazıyor...';
            typingIndicatorDiv.style.display = 'block';
        } else {
            typingIndicatorDiv.style.display = 'none';
        }
    });

    // ========================================================
    // MESAJ PAYLAŞMA VE AKIŞ İŞLEMLERİ
    // ========================================================
    const appContainer = document.getElementById('app-container');
    const feedWindow = document.getElementById('feed-window');
    const sendBtn = document.getElementById('send-btn');
    const statusDot = document.getElementById('connection-status');
    const localLikes = JSON.parse(localStorage.getItem('mm26_likes')) || {};

    db.ref('.info/connected').on('value', function(snap) {
        statusDot.className = snap.val() === true ? "status" : "status offline";
    });

    function sendMessage() {
        const text = msgInput.value.trim();
        if (!text || !myUsername) return;

        const timestamp = Date.now();
        const dateObj = new Date(timestamp);
        const timeStr = dateObj.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });

        sendBtn.textContent = '...'; sendBtn.disabled = true;

        messagesRef.push({
            username: myUsername,
            avatarChar: myUsername.charAt(0).toUpperCase(),
            text: text, time: timeStr, timestamp: timestamp, likes: 0, deleted: false
        }).then(() => {
            msgInput.value = ''; appContainer.scrollTo({ top: 0, behavior: 'smooth' });
            sendBtn.textContent = 'Paylaş'; sendBtn.disabled = false;
            typingRef.child(myUsername).remove(); 
        }).catch(() => {
            alert("Gönderilemedi!"); sendBtn.textContent = 'Paylaş'; sendBtn.disabled = false;
        });
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    messagesRef.on('value', (snapshot) => {
        feedWindow.innerHTML = ''; 
        const data = snapshot.val();
        if (!data) return;

        const messages = Object.keys(data).map(key => ({ id: key, ...data[key] })).sort((a, b) => b.timestamp - a.timestamp);
        let hasNewUnseenMessage = false;

        messages.forEach(msg => {
            if (msg.deleted) return;

            const mentionTag = `@${myUsername}`;
            const isMentioned = myUsername && msg.text && msg.text.toLowerCase().includes(mentionTag.toLowerCase());

            if (msg.timestamp > APP_LOAD_TIME && msg.username !== myUsername && !notifiedMessages.has(msg.id)) {
                notifiedMessages.add(msg.id);
                hasNewUnseenMessage = true;
                if (isMentioned) sendDesktopNotification("Biri senden bahsetti!", `${msg.username}: "${msg.text}"`);
                else if (document.hidden) sendDesktopNotification(`Yeni Mesaj: ${msg.username}`, msg.text);
            }

            const isLiked = localLikes[msg.id];
            const div = document.createElement('div');
            div.className = 'thread-post';
            
            let safeText = escapeHTML(msg.text || "");
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            safeText = safeText.replace(urlRegex, '<a href="$1" target="_blank" class="post-link">$1</a>');
            const mentionRegex = /@([a-zA-Z0-9_ğüşöçıİĞÜŞÖÇ]+)/gi;
            safeText = safeText.replace(mentionRegex, `<span class="mention clickable-profile" onclick="openProfile('$1')">@$1</span>`);

            const msgUserObj = allUsersData[msg.username];
            let renderAvatarHTML = '';
            let verifiedHTML = '';
            
            if (msgUserObj) {
                if (msgUserObj.verified || msgUserObj.role === 'admin') {
                    verifiedHTML = `<svg class="verified-badge"><use href="#icon-verified"></use></svg>`;
                }
                if (msgUserObj.profilePic) {
                    renderAvatarHTML = `<img src="${msgUserObj.profilePic}" class="avatar-circle clickable-profile" onclick="openProfile('${escapeHTML(msg.username)}')">`;
                }
            }
            if (!renderAvatarHTML) {
                renderAvatarHTML = `<div class="avatar-circle clickable-profile" onclick="openProfile('${escapeHTML(msg.username)}')">${escapeHTML(msg.avatarChar || 'A')}</div>`;
            }

            // SADECE KENDİ MESAJINI VEYA ADMİNSEN HERKESİN MESAJINI SİLEBİLİRSİN
            let deleteBtnHTML = '';
            let iamAdmin = (allUsersData[myUsername] && allUsersData[myUsername].role === 'admin');
            
            if (msg.username === myUsername || iamAdmin) {
                deleteBtnHTML = `
                <button class="action-btn btn-delete" onclick="deleteMsg('${msg.id}')" title="Gönderiyi Sil">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                </button>`;
            }

            div.innerHTML = `
                <div class="post-avatar">${renderAvatarHTML}</div>
                <div class="post-content">
                    <div class="post-header">
                        <div class="post-author-wrapper">
                            <span class="post-author clickable-profile" onclick="openProfile('${escapeHTML(msg.username)}')">${escapeHTML(msg.username || 'Anonim')}</span>
                            ${verifiedHTML}
                        </div>
                        <span class="post-time">${msg.time}</span>
                    </div>
                    <div class="post-text">${safeText}</div>
                    <div class="post-actions">
                        <button class="action-btn btn-like ${isLiked ? 'liked' : ''}" onclick="likeMsg('${msg.id}', ${msg.likes})">
                            <svg width="20" height="20" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                            </svg>
                            <span>${msg.likes > 0 ? msg.likes : ''}</span>
                        </button>
                        ${deleteBtnHTML}
                    </div>
                </div>
            `;
            
            feedWindow.appendChild(div);
        });

        if (hasNewUnseenMessage) {
            notifSound.currentTime = 0; notifSound.play().catch(e => console.log(e));
            if (document.hidden) { unreadCount++; document.title = `(${unreadCount}) Yeni Mesaj - Middle Message 26`; }
        }
    });

    window.likeMsg = function(msgId, currentLikes) {
        if (localLikes[msgId]) return;
        messagesRef.child(msgId).update({ likes: (currentLikes || 0) + 1 });
        localLikes[msgId] = true; localStorage.setItem('mm26_likes', JSON.stringify(localLikes));
    };

    window.deleteMsg = function(msgId) {
        if(confirm('Bu gönderiyi kalıcı olarak silmek istiyor musunuz?')) messagesRef.child(msgId).update({ deleted: true });
    };
</script>
</body>
</html>
