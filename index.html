<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Middle Message 26</title>
    
    <!-- Firebase V8 Kütüphaneleri -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* Threads / Instagram Dark Mode Renk Paleti */
        :root {
            --bg-base: #101010;
            --text-main: #F3F5F7;
            --text-muted: #777777;
            --border: #2A2A2A;
            --accent: #E0E0E0;
            --like-color: #FF3040;
            --danger: #FF453A;
            --mention: #0A84FF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        #app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 600px;
            height: 100%;
            background-color: var(--bg-base);
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            scroll-behavior: smooth;
            position: relative;
        }

        header {
            position: sticky;
            top: 0;
            padding: 16px 20px;
            background: rgba(16, 16, 16, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        #logout-btn {
            position: absolute;
            left: 20px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, transform 0.1s;
        }

        #logout-btn:hover { color: var(--danger); }
        #logout-btn:active { transform: scale(0.9); }

        .brand {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        .status {
            position: absolute;
            right: 20px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3fb950;
        }
        .status.offline { background: #FF453A; }

        /* =========================================
           YENİ: ARAMA ÇUBUĞU VE ÖNERİLER SİSTEMİ
           ========================================= */
        #search-container {
            padding: 12px 20px;
            background: var(--bg-base);
            border-bottom: 1px solid var(--border);
            position: relative;
            z-index: 40;
        }
        
        .search-input-wrapper {
            display: flex;
            background-color: #1A1A1A;
            border-radius: 20px;
            padding: 8px 16px;
            border: 1px solid #333;
            align-items: center;
            gap: 10px;
        }

        #user-search-input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        #suggestions-box {
            position: absolute;
            top: 100%;
            left: 20px;
            right: 20px;
            background: #161616;
            border: 1px solid #333;
            border-radius: 12px;
            max-height: 250px;
            overflow-y: auto;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            margin-top: 5px;
        }

        .suggestion-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            border-bottom: 1px solid #222;
            transition: background 0.2s;
        }
        
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background: #222; }

        .sugg-avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: #333;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 0.9rem;
        }

        /* ========================================= */

        #hero-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 35vh; 
            padding: 20px;
            border-bottom: 1px solid var(--border);
            background: radial-gradient(circle at center, #181818 0%, #101010 100%);
        }

        .input-wrapper {
            display: flex;
            background-color: #1A1A1A;
            border-radius: 30px;
            padding: 8px 8px 8px 24px;
            border: 1px solid #333;
            align-items: center;
            width: 100%;
            max-width: 500px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: border-color 0.3s;
        }

        .input-wrapper:focus-within { border-color: #555; }

        #msg-input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.05rem;
            outline: none;
        }

        #send-btn {
            background-color: var(--text-main);
            color: var(--bg-base);
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        #send-btn:active { transform: scale(0.95); }

        #feed-window {
            display: flex;
            flex-direction: column;
            padding-bottom: 50px;
        }

        .thread-post {
            display: flex;
            gap: 12px;
            padding: 20px;
            border-bottom: 1px solid var(--border);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* YENİ: Tıklanabilir Profil Efektleri */
        .clickable-profile {
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .clickable-profile:hover { opacity: 0.7; }
        .post-author.clickable-profile:hover { text-decoration: underline; }

        .post-avatar {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-circle {
            width: 42px; height: 42px;
            border-radius: 50%;
            background-color: #1e1e1e;
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; color: #ccc; font-size: 1.1rem;
            border: 1px solid #333; text-transform: uppercase;
        }

        .post-content { flex: 1; display: flex; flex-direction: column; }
        .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .post-author { font-weight: 600; font-size: 0.95rem; color: var(--text-main); }
        .post-time { font-size: 0.85rem; color: var(--text-muted); }
        .post-text { font-size: 1rem; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; margin-bottom: 12px; }
        
        .mention {
            color: var(--mention); font-weight: 600; background: rgba(10, 132, 255, 0.15);
            padding: 2px 6px; border-radius: 6px;
        }

        .post-actions { display: flex; gap: 16px; }
        .action-btn {
            background: none; border: none; color: var(--text-main); cursor: pointer;
            display: flex; align-items: center; gap: 6px; font-size: 0.9rem;
        }
        .btn-like svg { fill: none; stroke: var(--text-main); stroke-width: 2; }
        .btn-like.liked { color: var(--like-color); font-weight: 500; }
        .btn-like.liked svg { fill: var(--like-color); stroke: var(--like-color); }

        /* =========================================
           MODALLAR (HESAP VE PROFİL PENCERELERİ)
           ========================================= */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }

        .modal-box {
            background-color: #161616; border: 1px solid var(--border); padding: 35px 25px;
            border-radius: 24px; text-align: center; width: 90%; max-width: 340px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); animation: fadeIn 0.3s ease; position: relative;
        }

        .modal-box h2 { margin-bottom: 10px; font-size: 1.4rem; }
        .modal-box p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px; line-height: 1.4; }

        #username-input {
            width: 100%; padding: 14px 20px; border-radius: 12px; border: 1px solid #333;
            background: #000; color: #fff; font-size: 1.05rem; outline: none; text-align: center; margin-bottom: 15px;
        }
        #start-btn {
            width: 100%; padding: 14px; border-radius: 12px; background: var(--text-main); color: var(--bg-base);
            font-size: 1.05rem; font-weight: 700; border: none; cursor: pointer;
        }

        /* YENİ: PROFİL MODALI STİLLERİ */
        #profile-close {
            position: absolute; top: 15px; right: 15px; background: none; border: none;
            color: #888; cursor: pointer; font-size: 1.5rem; line-height: 1; padding: 5px;
        }
        #profile-close:hover { color: #fff; }
        
        .profile-avatar-large {
            width: 80px; height: 80px; border-radius: 50%; background: #222;
            display: flex; justify-content: center; align-items: center; font-size: 2.5rem;
            font-weight: bold; margin: 0 auto 15px; border: 2px solid #444; color: #E0E0E0; text-transform: uppercase;
        }
        
        .profile-username { font-size: 1.5rem; font-weight: bold; margin-bottom: 5px; }
        .follower-count-box { color: var(--text-muted); font-size: 1rem; margin-bottom: 25px; }
        .follower-count-box span { color: var(--text-main); font-weight: bold; }
        
        #follow-btn {
            padding: 12px 30px; border-radius: 20px; background: var(--text-main); color: var(--bg-base);
            font-size: 1.05rem; font-weight: bold; border: none; cursor: pointer; width: 100%; transition: 0.2s;
        }
        #follow-btn.following { background: transparent; color: var(--text-main); border: 1px solid #555; }
        
        @media (max-width: 600px) {
            #app-container { border: none; }
            #hero-section { min-height: 35vh; }
        }
    </style>
</head>
<body>

<!-- KULLANICI GİRİŞ MODALI -->
<div id="welcome-modal" class="modal-overlay">
    <div class="modal-box">
        <h2>Middle Message 26</h2>
        <p>Ağa katılmak ve mesaj göndermek için bir kullanıcı adı belirleyin.</p>
        <input type="text" id="username-input" placeholder="Kullanıcı Adınız" autocomplete="off" maxlength="15">
        <button id="start-btn">Sohbete Katıl</button>
    </div>
</div>

<!-- KULLANICI PROFİLİ MODALI -->
<div id="profile-modal" class="modal-overlay">
    <div class="modal-box">
        <button id="profile-close">&times;</button>
        <div class="profile-avatar-large" id="profile-avatar">A</div>
        <div class="profile-username" id="profile-name">Anonim</div>
        <div class="follower-count-box"><span id="profile-followers">0</span> Takipçi</div>
        <button id="follow-btn">Takip Et</button>
    </div>
</div>

<!-- ANA UYGULAMA (Tümü Kaydırılabilir) -->
<div id="app-container">
    <header>
        <button id="logout-btn" title="Çıkış Yap">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
        </button>
        <div class="brand">Middle Message 26</div>
        <div class="status" id="connection-status"></div>
    </header>
    
    <!-- YENİ: ARAMA ÇUBUĞU -->
    <div id="search-container">
        <div class="search-input-wrapper">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="user-search-input" placeholder="Kişi ara..." autocomplete="off">
        </div>
        <!-- Öneriler Kutusu -->
        <div id="suggestions-box"></div>
    </div>
    
    <!-- YAZMA ALANI -->
    <div id="hero-section">
        <div class="input-wrapper">
            <input type="text" id="msg-input" placeholder="Bir konu başlat veya @isim etiketle..." autocomplete="off">
            <button id="send-btn">Paylaş</button>
        </div>
    </div>

    <div id="feed-window">
        <!-- Akış Gönderileri Buraya Gelecek -->
    </div>
</div>

<script>
    // ========================================================
    // 1. FIREBASE BAĞLANTISI VE YENİ REFERANSLAR
    // ========================================================
    const firebaseConfig = {
      apiKey: "AIzaSyD-E9XQdyJBg8fW2_UcT_wbRCGwhckzmKA",
      authDomain: "middlemessage26.firebaseapp.com",
      databaseURL: "https://middlemessage26-default-rtdb.firebaseio.com",
      projectId: "middlemessage26",
      storageBucket: "middlemessage26.firebasestorage.app",
      messagingSenderId: "395440473558",
      appId: "1:395440473558:web:ccf986566cf3d2b600d077",
      measurementId: "G-WQ67GTWB1Q"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const messagesRef = db.ref('middle_message_26_room');
    
    // YENİ: Veritabanı Düğümleri (Users ve Followers)
    const usersRef = db.ref('middle_message_26_users');
    const followersRef = db.ref('middle_message_26_followers');

    // ========================================================
    // BİLDİRİM VE SES SİSTEMİ (WhatsApp Tarzı)
    // ========================================================
    const APP_LOAD_TIME = Date.now();
    const notifiedMessages = new Set();
    let unreadCount = 0;
    const notifSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

    function askNotificationPermission() {
        if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
            Notification.requestPermission();
        }
    }

    function sendDesktopNotification(title, body) {
        if ("Notification" in window && Notification.permission === "granted") {
            new Notification(title, { body: body, icon: "https://cdn-icons-png.flaticon.com/512/3114/3114883.png" });
        }
    }

    window.addEventListener('focus', () => { unreadCount = 0; document.title = 'Middle Message 26'; });

    // XSS Güvenliği İçin
    function escapeHTML(str) {
        if (!str) return "";
        return str.replace(/[&<>'"]/g, tag => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[tag]));
    }

    // ========================================================
    // KULLANICI ADI SİSTEMİ & HESAP OLUŞTURMA
    // ========================================================
    let myUsername = localStorage.getItem('mm26_username');
    const welcomeModal = document.getElementById('welcome-modal');
    const nameInput = document.getElementById('username-input');
    const startBtn = document.getElementById('start-btn');
    const logoutBtn = document.getElementById('logout-btn');

    if (!myUsername) {
        welcomeModal.style.display = 'flex';
        nameInput.focus();
    } else {
        askNotificationPermission(); 
        // Uygulama her açıldığında kullanıcının veritabanındaki yerini tazeliyoruz
        usersRef.child(myUsername).update({ username: myUsername, lastActive: Date.now() });
    }

    function saveUsername() {
        let val = nameInput.value.trim();
        // İsimde geçersiz veritabanı sembollerini temizle
        val = val.replace(/[.#$\[\]]/g, '');
        
        if (val.length >= 3) {
            myUsername = val;
            localStorage.setItem('mm26_username', myUsername);
            
            // YENİ: Hesabı veritabanına "Kullanıcı" olarak resmi kayıt et
            usersRef.child(myUsername).update({ username: myUsername, createdAt: Date.now() });
            
            welcomeModal.style.display = 'none'; 
            askNotificationPermission(); 
            
            notifSound.volume = 0;
            notifSound.play().then(() => { notifSound.pause(); notifSound.volume = 1; }).catch(e => console.log(e));
        } else {
            alert('Lütfen en az 3 harfli, noktalama işareti içermeyen bir isim girin.');
        }
    }

    startBtn.addEventListener('click', saveUsername);
    nameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') saveUsername(); });

    logoutBtn.addEventListener('click', () => {
        if (confirm('Çıkış yapmak istediğinize emin misiniz?')) {
            localStorage.removeItem('mm26_username'); 
            window.location.reload(); 
        }
    });

    // ========================================================
    // YENİ: ARAMA ÇUBUĞU VE ÖNERİLER SİSTEMİ
    // ========================================================
    const searchInput = document.getElementById('user-search-input');
    const suggestionsBox = document.getElementById('suggestions-box');
    let allUsersList = [];

    // Veritabanındaki kayıtlı tüm kullanıcıları çek
    usersRef.on('value', snap => {
        if (snap.val()) {
            allUsersList = Object.keys(snap.val()); // Kullanıcı adlarının listesi
        }
    });

    searchInput.addEventListener('input', () => {
        const query = searchInput.value.trim().toLowerCase();
        suggestionsBox.innerHTML = '';
        
        if (query.length === 0) {
            suggestionsBox.style.display = 'none';
            return;
        }

        // Girilen harfleri içeren kişileri bul
        const filteredUsers = allUsersList.filter(u => u.toLowerCase().includes(query)).slice(0, 5); // En fazla 5 kişi
        
        if (filteredUsers.length > 0) {
            filteredUsers.forEach(user => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.innerHTML = `
                    <div class="sugg-avatar">${escapeHTML(user.charAt(0).toUpperCase())}</div>
                    <span>${escapeHTML(user)}</span>
                `;
                // Tıklanınca Profilini Aç ve aramayı temizle
                div.onclick = () => {
                    openProfile(user);
                    searchInput.value = '';
                    suggestionsBox.style.display = 'none';
                };
                suggestionsBox.appendChild(div);
            });
            suggestionsBox.style.display = 'block';
        } else {
            suggestionsBox.style.display = 'none';
        }
    });

    // Ekranda boş bir yere tıklanırsa arama kutusunu kapat
    document.addEventListener('click', (e) => {
        if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
            suggestionsBox.style.display = 'none';
        }
    });

    // ========================================================
    // YENİ: PROFİL GÖRÜNTÜLEME VE TAKİP SİSTEMİ
    // ========================================================
    const profileModal = document.getElementById('profile-modal');
    const profileCloseBtn = document.getElementById('profile-close');
    const profileAvatar = document.getElementById('profile-avatar');
    const profileName = document.getElementById('profile-name');
    const profileFollowers = document.getElementById('profile-followers');
    const followBtn = document.getElementById('follow-btn');
    
    let currentProfileUser = "";
    let profileListener = null; // Canlı takipçi sayısını dinlemek için

    function openProfile(targetUsername) {
        currentProfileUser = targetUsername;
        profileName.textContent = targetUsername;
        profileAvatar.textContent = targetUsername.charAt(0).toUpperCase();
        
        // Modal aç
        profileModal.style.display = 'flex';
        
        // Eğer kendi profilimse Takip butonunu gizle
        if (targetUsername === myUsername) {
            followBtn.style.display = 'none';
        } else {
            followBtn.style.display = 'block';
        }

        // Önceki dinleyiciyi temizle ki karışıklık olmasın
        if (profileListener) followersRef.child(currentProfileUser).off('value', profileListener);

        // Bu kişinin takipçilerini Canlı Dinle
        profileListener = followersRef.child(currentProfileUser).on('value', snap => {
            const followersData = snap.val();
            let count = 0;
            let amIFollowing = false;
            
            if (followersData) {
                const keys = Object.keys(followersData);
                count = keys.length;
                if (keys.includes(myUsername)) amIFollowing = true;
            }
            
            // Ekrana yazdır
            profileFollowers.textContent = count;
            
            // Takip Butonu Görünümü
            if (amIFollowing) {
                followBtn.textContent = 'Takibi Bırak';
                followBtn.className = 'following';
            } else {
                followBtn.textContent = 'Takip Et';
                followBtn.className = '';
            }
        });
    }

    profileCloseBtn.onclick = () => {
        profileModal.style.display = 'none';
        if (profileListener) followersRef.child(currentProfileUser).off('value', profileListener);
    };

    // Takip Et / Bırak İşlemi
    followBtn.onclick = () => {
        if (!myUsername || currentProfileUser === myUsername) return;
        
        const myFollowRef = followersRef.child(currentProfileUser).child(myUsername);
        myFollowRef.once('value', snap => {
            if (snap.exists()) {
                myFollowRef.remove(); // Takipten çık
            } else {
                myFollowRef.set(true); // Takip et
            }
        });
    };

    // ========================================================
    // MESAJLAŞMA İŞLEMLERİ
    // ========================================================
    const appContainer = document.getElementById('app-container');
    const feedWindow = document.getElementById('feed-window');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const statusDot = document.getElementById('connection-status');
    const localLikes = JSON.parse(localStorage.getItem('mm26_likes')) || {};

    db.ref('.info/connected').on('value', function(snap) {
        statusDot.className = snap.val() === true ? "status" : "status offline";
    });

    function sendMessage() {
        const text = msgInput.value.trim();
        if (!text || !myUsername) return;

        const timestamp = Date.now();
        const dateObj = new Date(timestamp);
        const timeStr = dateObj.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });

        messagesRef.push({
            username: myUsername,
            avatarChar: myUsername.charAt(0).toUpperCase(),
            text: text,
            time: timeStr,
            timestamp: timestamp,
            likes: 0,
            deleted: false
        });

        msgInput.value = '';
        appContainer.scrollTo({ top: 0, behavior: 'smooth' });
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    messagesRef.on('value', (snapshot) => {
        feedWindow.innerHTML = ''; 
        const data = snapshot.val();
        if (!data) return;

        const messages = Object.keys(data).map(key => ({
            id: key, ...data[key]
        })).sort((a, b) => b.timestamp - a.timestamp);

        let hasNewUnseenMessage = false;

        messages.forEach(msg => {
            if (msg.deleted) return;

            const mentionTag = `@${myUsername}`;
            const isMentioned = myUsername && msg.text.toLowerCase().includes(mentionTag.toLowerCase());

            if (msg.timestamp > APP_LOAD_TIME && msg.username !== myUsername && !notifiedMessages.has(msg.id)) {
                notifiedMessages.add(msg.id);
                hasNewUnseenMessage = true;

                if (isMentioned) {
                    sendDesktopNotification("Biri senden bahsetti!", `${msg.username}: "${msg.text}"`);
                } else if (document.hidden) {
                    sendDesktopNotification(`Yeni Mesaj: ${msg.username}`, msg.text);
                }
            }

            const isLiked = localLikes[msg.id];
            const div = document.createElement('div');
            div.className = 'thread-post';
            
            let safeText = escapeHTML(msg.text);
            if (myUsername) {
                const regex = new RegExp(`@${myUsername}\\b`, 'gi');
                safeText = safeText.replace(regex, `<span class="mention">$&</span>`);
            }

            div.innerHTML = `
                <div class="post-avatar">
                    <div class="avatar-circle clickable-profile" onclick="openProfile('${escapeHTML(msg.username)}')">${escapeHTML(msg.avatarChar || 'A')}</div>
                </div>
                <div class="post-content">
                    <div class="post-header">
                        <span class="post-author clickable-profile" onclick="openProfile('${escapeHTML(msg.username)}')">${escapeHTML(msg.username || 'Anonim')}</span>
                        <span class="post-time">${msg.time}</span>
                    </div>
                    <div class="post-text">${safeText}</div>
                    <div class="post-actions">
                        <button class="action-btn btn-like ${isLiked ? 'liked' : ''}" onclick="likeMsg('${msg.id}', ${msg.likes})">
                            <svg width="20" height="20" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                            </svg>
                            <span>${msg.likes > 0 ? msg.likes : ''}</span>
                        </button>
                        <button class="action-btn btn-delete" onclick="deleteMsg('${msg.id}')" title="Gönderiyi Sil">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            `;
            
            feedWindow.appendChild(div);
        });

        if (hasNewUnseenMessage) {
            notifSound.currentTime = 0;
            notifSound.play().catch(e => console.log(e));

            if (document.hidden) {
                unreadCount++;
                document.title = `(${unreadCount}) Yeni Mesaj - Middle Message 26`;
            }
        }
    });

    window.likeMsg = function(msgId, currentLikes) {
        if (localLikes[msgId]) return;
        messagesRef.child(msgId).update({ likes: (currentLikes || 0) + 1 });
        localLikes[msgId] = true;
        localStorage.setItem('mm26_likes', JSON.stringify(localLikes));
    };

    window.deleteMsg = function(msgId) {
        if(confirm('Bu gönderiyi kalıcı olarak silmek istiyor musunuz?')) {
            messagesRef.child(msgId).update({ deleted: true });
        }
    };
</script>
</body>
</html>
