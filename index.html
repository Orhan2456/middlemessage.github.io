<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Middle Message 26</title>
    
    <!-- Firebase V8 Kütüphaneleri -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --message-bg: #21262d;
            --accent: #2f81f7;
            --accent-hover: #1f6feb;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --danger: #f85149;
            --border: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 800px;
            height: 100%;
            background-color: var(--bg-color);
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }

        header {
            padding: 15px 20px;
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand {
            font-weight: 700;
            font-size: 1.2rem;
        }

        .status {
            font-size: 0.8rem;
            color: #3fb950;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .status::before {
            content: "";
            display: block;
            width: 8px;
            height: 8px;
            background: #3fb950;
            border-radius: 50%;
            box-shadow: 0 0 8px #3fb950;
        }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message-bubble {
            background-color: var(--message-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            animation: fadeIn 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 8px;
        }

        .message-text {
            font-size: 1rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message-footer {
            display: flex;
            gap: 15px;
            padding-top: 5px;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.2s;
        }

        .action-btn:hover { color: var(--text-main); }
        .btn-like.liked { color: var(--accent); font-weight: bold; }
        .btn-delete:hover { color: var(--danger); }

        #input-area {
            display: flex;
            padding: 15px;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border);
            gap: 10px;
        }

        #msg-input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        #msg-input:focus { border-color: var(--accent); }

        #send-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #send-btn:hover { background-color: var(--accent-hover); }

        @media (max-width: 600px) {
            #app-container { border: none; }
        }
    </style>
</head>
<body>

<div id="app-container">
    <header>
        <div class="brand">Middle Message 26</div>
        <div class="status" id="connection-status">Bağlanıyor...</div>
    </header>
    
    <div id="chat-window"></div>
    
    <div id="input-area">
        <input type="text" id="msg-input" placeholder="Ortaya bir mesaj yaz..." autocomplete="off">
        <button id="send-btn">Gönder</button>
    </div>
</div>

<script>
    // ========================================================
    // 1. ADIM: FIREBASE BAĞLANTISI 
    // Farklı internet ağlarında çalışması için buraya kendi ücretsiz 
    // Firebase yapılandırmanızı yapıştırmalısınız.
    // ========================================================
    const firebaseConfig = {
      apiKey: "AIzaSyD-E9XQdyJBg8fW2_UcT_wbRCGwhckzmKA",
      authDomain: "middlemessage26.firebaseapp.com",
      databaseURL: "https://middlemessage26-default-rtdb.firebaseio.com",
      projectId: "middlemessage26",
      storageBucket: "middlemessage26.firebasestorage.app",
      messagingSenderId: "395440473558",
      appId: "1:395440473558:web:ccf986566cf3d2b600d077",
      measurementId: "G-WQ67GTWB1Q"
    }

    // Firebase'i Başlat
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    
    // Veritabanındaki 'messages' klasörüne referans
    const messagesRef = db.ref('middle_message_26_room');

    // ========================================================
    // 2. ADIM: ARAYÜZ VE İŞLEMLER
    // ========================================================
    const chatWindow = document.getElementById('chat-window');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const statusText = document.getElementById('connection-status');
    
    const localLikes = JSON.parse(localStorage.getItem('mm26_likes')) || {};

    // Bağlantı durumunu kontrol et
    db.ref('.info/connected').on('value', function(snap) {
        if (snap.val() === true) {
            statusText.textContent = "Bağlı";
            statusText.style.color = "#3fb950";
        } else {
            statusText.textContent = "Bağlantı Bekleniyor...";
            statusText.style.color = "#f85149";
        }
    });

    // Mesaj Gönder
    function sendMessage() {
        const text = msgInput.value.trim();
        if (!text) return;

        const timestamp = Date.now();
        const dateObj = new Date(timestamp);
        const timeStr = dateObj.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });

        // Veritabanına yeni mesaj ekle
        messagesRef.push({
            text: text,
            time: timeStr,
            timestamp: timestamp,
            likes: 0,
            deleted: false
        });

        msgInput.value = '';
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // Veritabanından Mesajları Gerçek Zamanlı Oku
    messagesRef.on('value', (snapshot) => {
        chatWindow.innerHTML = ''; // Ekranı temizle
        const data = snapshot.val();
        
        if (!data) return;

        // Mesajları zamana göre sırala
        const messages = Object.keys(data).map(key => ({
            id: key,
            ...data[key]
        })).sort((a, b) => a.timestamp - b.timestamp);

        messages.forEach(msg => {
            // Silinmiş mesajları ekranda gösterme
            if (msg.deleted) return;

            const isLiked = localLikes[msg.id];
            const div = document.createElement('div');
            div.className = 'message-bubble';
            
            // XSS açıklarına karşı metni güvenli yerleştirme
            div.innerHTML = `
                <div class="message-header">
                    <span>Anonim Kullanıcı</span>
                    <span>${msg.time}</span>
                </div>
                <div class="message-text"></div>
                <div class="message-footer">
                    <button class="action-btn btn-like ${isLiked ? 'liked' : ''}" onclick="likeMsg('${msg.id}', ${msg.likes})">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="${isLiked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                        <span>${msg.likes || 0}</span>
                    </button>
                    <button class="action-btn btn-delete" onclick="deleteMsg('${msg.id}')">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        Sil
                    </button>
                </div>
            `;
            div.querySelector('.message-text').textContent = msg.text;
            chatWindow.appendChild(div);
        });

        // Yeni mesaj gelince en alta kaydır
        chatWindow.scrollTop = chatWindow.scrollHeight;
    });

    // Mesaj Beğen (Anlık Güncelleme)
    window.likeMsg = function(msgId, currentLikes) {
        if (localLikes[msgId]) return; // Zaten beğenilmişse dur

        messagesRef.child(msgId).update({
            likes: currentLikes + 1
        });
        
        localLikes[msgId] = true;
        localStorage.setItem('mm26_likes', JSON.stringify(localLikes));
    };

    // Mesaj Sil (Anlık olarak herkesin ekranından kalkar)
    window.deleteMsg = function(msgId) {
        if(confirm('Mesajı herkesin ekranından kalıcı olarak silmek istiyor musunuz?')) {
            messagesRef.child(msgId).update({
                deleted: true
            });
        }
    };
</script>
</body>
</html>
