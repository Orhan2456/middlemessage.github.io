<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Middle Message 26</title>
    
    <!-- Firebase V8 Kütüphaneleri -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* Threads / X (Twitter) Dark Mode Renk Paleti */
        :root {
            --bg-base: #101010;
            --text-main: #F3F5F7;
            --text-muted: #777777;
            --border: #2A2A2A;
            --accent: #E0E0E0;
            --like-color: #FF3040;
            --danger: #FF453A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Zarif Kaydırma Çubuğu */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        /* Ana Çerçeve */
        #app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 600px; /* Dar ve şık görünüm */
            height: 100%;
            background-color: var(--bg-base);
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }

        /* Üst Başlık (Sabit) */
        header {
            padding: 16px 20px;
            background: rgba(16, 16, 16, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: center; /* Ortala */
            align-items: center;
            z-index: 10;
            position: relative; /* Artık akışın bir parçası */
        }

        .brand {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        .status {
            position: absolute;
            right: 20px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3fb950;
        }
        .status.offline { background: #FF453A; }

        /* Kaydırılabilir Ana Alan */
        #main-scroll-area {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }

        /* Mesaj Yazma Çubuğu (En Üstte ve Ortada) */
        #input-area {
            padding: 25px 20px;
            display: flex;
            justify-content: center; /* Çubuğu tam ortaya alır */
            border-bottom: 1px solid var(--border);
            background-color: var(--bg-base);
        }

        .input-wrapper {
            display: flex;
            background-color: #1A1A1A;
            border-radius: 30px;
            padding: 6px 6px 6px 20px;
            border: 1px solid #333;
            align-items: center;
            width: 100%;
            max-width: 480px; /* Çok uzamasını engeller, şık durur */
        }

        #msg-input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }
        #msg-input::placeholder { color: #555; }

        #send-btn {
            background-color: var(--text-main);
            color: var(--bg-base);
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        #send-btn:hover { opacity: 0.8; }

        /* Gönderi Akışı (Feed) */
        #feed-window {
            display: flex;
            flex-direction: column;
            padding-bottom: 40px; /* Alt kısımdan biraz boşluk */
        }

        /* Gönderi Görünümü (Post) */
        .thread-post {
            display: flex;
            gap: 12px;
            padding: 20px;
            border-bottom: 1px solid var(--border);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Profil Fotoğrafı (Baş Harf) */
        .post-avatar {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: #1e1e1e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #ccc;
            font-size: 1.1rem;
            border: 1px solid #333;
            text-transform: uppercase;
        }

        .post-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .post-author {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .post-time {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .post-text {
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-bottom: 12px;
        }

        .post-actions {
            display: flex;
            gap: 16px;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            transition: transform 0.1s;
        }
        .action-btn:active { transform: scale(0.9); }
        
        .btn-like svg {
            fill: none;
            stroke: var(--text-main);
            stroke-width: 2;
        }
        .btn-like.liked { color: var(--like-color); font-weight: 500; }
        .btn-like.liked svg {
            fill: var(--like-color);
            stroke: var(--like-color);
        }

        /* Hoş Geldin Ekranı (Kullanıcı Adı) */
        #welcome-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background-color: #161616;
            border: 1px solid var(--border);
            padding: 35px 25px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 340px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .modal-box h2 { margin-bottom: 10px; font-size: 1.4rem; }
        .modal-box p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px; line-height: 1.4; }

        #username-input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid #333;
            background: #000;
            color: #fff;
            font-size: 1.05rem;
            outline: none;
            text-align: center;
            margin-bottom: 15px;
        }
        #username-input:focus { border-color: #555; }

        #start-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            background: var(--text-main);
            color: var(--bg-base);
            font-size: 1.05rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            #app-container { border: none; }
        }
    </style>
</head>
<body>

<!-- Kullanıcı Adı Belirleme Ekranı -->
<div id="welcome-modal" style="display: none;">
    <div class="modal-box">
        <h2>Middle Message 26</h2>
        <p>Akışa katılmak ve fikirlerinizi paylaşmak için bir isim belirleyin.</p>
        <input type="text" id="username-input" placeholder="Kullanıcı Adınız" autocomplete="off" maxlength="15">
        <button id="start-btn">Katıl</button>
    </div>
</div>

<!-- Ana Uygulama -->
<div id="app-container">
    <header>
        <div class="brand">Middle Message 26</div>
        <div class="status" id="connection-status"></div>
    </header>
    
    <!-- Akış ve Yazma Alanı (İkisi de burada kaydırılabilir) -->
    <div id="main-scroll-area">
        
        <!-- YAZMA ÇUBUĞU (En Üstte Ortada) -->
        <div id="input-area">
            <div class="input-wrapper">
                <input type="text" id="msg-input" placeholder="Bir konu başlat..." autocomplete="off">
                <button id="send-btn">Paylaş</button>
            </div>
        </div>

        <!-- GÖNDERİLER (Yeni mesajlar üste düşecek) -->
        <div id="feed-window">
            <!-- Akış Gönderileri Buraya Gelecek -->
        </div>
        
    </div>
</div>

<script>
    // ========================================================
    // 1. FIREBASE BAĞLANTISI
    // ========================================================
    const firebaseConfig = {
      apiKey: "AIzaSyD-E9XQdyJBg8fW2_UcT_wbRCGwhckzmKA",
      authDomain: "middlemessage26.firebaseapp.com",
      databaseURL: "https://middlemessage26-default-rtdb.firebaseio.com",
      projectId: "middlemessage26",
      storageBucket: "middlemessage26.firebasestorage.app",
      messagingSenderId: "395440473558",
      appId: "1:395440473558:web:ccf986566cf3d2b600d077"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const messagesRef = db.ref('middle_message_26_room');

    // ========================================================
    // 2. KULLANICI ADI SİSTEMİ
    // ========================================================
    let myUsername = localStorage.getItem('mm26_username');
    const welcomeModal = document.getElementById('welcome-modal');
    const nameInput = document.getElementById('username-input');
    const startBtn = document.getElementById('start-btn');

    if (!myUsername) {
        welcomeModal.style.display = 'flex';
        nameInput.focus();
    }

    function saveUsername() {
        const val = nameInput.value.trim();
        if (val.length >= 3) {
            myUsername = val;
            localStorage.setItem('mm26_username', myUsername);
            welcomeModal.style.display = 'none';
        } else {
            alert('Lütfen en az 3 harfli bir isim girin.');
        }
    }

    startBtn.addEventListener('click', saveUsername);
    nameInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') saveUsername();
    });

    // ========================================================
    // 3. ARAYÜZ VE İŞLEMLER
    // ========================================================
    const mainScrollArea = document.getElementById('main-scroll-area');
    const feedWindow = document.getElementById('feed-window');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const statusDot = document.getElementById('connection-status');
    const localLikes = JSON.parse(localStorage.getItem('mm26_likes')) || {};

    // Bağlantı durumunu nokta rengi ile gösterme
    db.ref('.info/connected').on('value', function(snap) {
        statusDot.className = snap.val() === true ? "status" : "status offline";
    });

    // Mesaj Gönder
    function sendMessage() {
        const text = msgInput.value.trim();
        if (!text || !myUsername) return;

        const timestamp = Date.now();
        const dateObj = new Date(timestamp);
        const timeStr = dateObj.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });

        messagesRef.push({
            username: myUsername,
            avatarChar: myUsername.charAt(0).toUpperCase(),
            text: text,
            time: timeStr,
            timestamp: timestamp,
            likes: 0,
            deleted: false
        });

        msgInput.value = '';
        
        // Gönderdikten sonra kaydırma çubuğunu en üste çıkar ki gönderdiğini görsün
        mainScrollArea.scrollTo({ top: 0, behavior: 'smooth' });
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // Veritabanından Mesajları Gerçek Zamanlı Oku
    messagesRef.on('value', (snapshot) => {
        feedWindow.innerHTML = ''; 
        const data = snapshot.val();
        if (!data) return;

        // DİKKAT: Artık b - a yapıyoruz ki EN YENİ mesajlar en üste (listenin başına) gelsin!
        const messages = Object.keys(data).map(key => ({
            id: key, ...data[key]
        })).sort((a, b) => b.timestamp - a.timestamp);

        messages.forEach(msg => {
            if (msg.deleted) return;

            const isLiked = localLikes[msg.id];
            const div = document.createElement('div');
            div.className = 'thread-post';
            
            div.innerHTML = `
                <div class="post-avatar">
                    <div class="avatar-circle avatar-placeholder"></div>
                </div>
                <div class="post-content">
                    <div class="post-header">
                        <span class="post-author author-placeholder"></span>
                        <span class="post-time">${msg.time}</span>
                    </div>
                    <div class="post-text text-placeholder"></div>
                    <div class="post-actions">
                        <button class="action-btn btn-like ${isLiked ? 'liked' : ''}" onclick="likeMsg('${msg.id}', ${msg.likes})">
                            <svg width="20" height="20" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                            </svg>
                            <span>${msg.likes > 0 ? msg.likes : ''}</span>
                        </button>
                        <button class="action-btn btn-delete" onclick="deleteMsg('${msg.id}')" title="Gönderiyi Sil">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            `;
            
            // XSS Koruma
            div.querySelector('.avatar-placeholder').textContent = msg.avatarChar || 'A';
            div.querySelector('.author-placeholder').textContent = msg.username || 'Anonim';
            div.querySelector('.text-placeholder').textContent = msg.text;
            
            feedWindow.appendChild(div);
        });
    });

    window.likeMsg = function(msgId, currentLikes) {
        if (localLikes[msgId]) return;
        messagesRef.child(msgId).update({ likes: (currentLikes || 0) + 1 });
        localLikes[msgId] = true;
        localStorage.setItem('mm26_likes', JSON.stringify(localLikes));
    };

    window.deleteMsg = function(msgId) {
        if(confirm('Bu gönderiyi kalıcı olarak silmek istiyor musunuz?')) {
            messagesRef.child(msgId).update({ deleted: true });
        }
    };
</script>
</body>
</html>
